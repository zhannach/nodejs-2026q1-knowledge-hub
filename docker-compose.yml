services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-hub-app:latest
    container_name: knowledge-hub-app
    ports:
      - "4000:4000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - RAG_VECTOR_DB_PROVIDER=${RAG_VECTOR_DB_PROVIDER:-qdrant}
      - RAG_VECTOR_DB_URL=${RAG_VECTOR_DB_URL:-http://vectordb:6333}
      - RAG_VECTOR_COLLECTION=${RAG_VECTOR_COLLECTION:-knowledge_hub_articles}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-800}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-200}
      - RAG_CONVERSATION_MAX_MESSAGES=${RAG_CONVERSATION_MAX_MESSAGES:-20}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    networks:
      - custom_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - custom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vectordb:
    image: qdrant/qdrant:v1.13.4
    container_name: knowledge-hub-vectordb
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - custom_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: knowledge-hub-adminer
    profiles:
      - debug
    ports:
      - "8080:8080"
    networks:
      - custom_network
    depends_on:
      - db

networks:
  custom_network:
    driver: bridge

volumes:
  pgdata:
  qdrantdata:
